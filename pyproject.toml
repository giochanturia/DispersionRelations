[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dispersionrelations"
version = "2.0.0-dev"
authors = [
    {name="George Chanturia"}
]
description = "Physics package for dispersion relations"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["numpy", "scipy", "scikit-image", "matplotlib", "uncertainties", "typing_extensions"]

[project.urls]
homepage = "https://github.com/giochanturia/DispersionRelations"
documentation = "https://dispersionrelations.readthedocs.io/"
source = "https://github.com/giochanturia/DispersionRelations"

[project.optional-dependencies]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
    "sphinxcontrib-bibtex",
    "docutils",
    "sphinx-autodoc-typehints",
]
dev = ["pytest", "pylint", "py2puml", "pycallgraph2", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=dispersionrelations --cov-report=html"

[tool.coverage.run]
branch = true
source = ["dispersionrelations"]
omit = [
    "src/dispersionrelations/__init__.py",
    "src/dispersionrelations/plotting.py",
    "*/dispersionrelations/plotting.py",
]

[tool.coverage.html]
extra_css = "docs/source/coverage/report_styles.css"
